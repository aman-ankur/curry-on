<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" role="img" aria-labelledby="title desc">
<title id="title">Build a familiar, balanced plate</title><desc id="desc">Half vegetables, a quarter protein, and a quarter rice or roti. Pulses supply both protein and carbohydrate. Use measured oil and a protein side when needed.</desc>
