<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">Curry On: twelve-week movement guide</title><desc id="desc">Three weekly strength sessions, gradually building from 60 to 150 minutes of moderate cardio and from 6000 to 7000–8000 daily steps. A sustainable weekly plan.</desc><rect width="1200" height="850" fill="#f7f6ef"/><g font-family="Arial,sans-serif" fill="#173f35"><text x="65" y="68" font-size="16" font-weight="700" letter-spacing="3">CURRY ON / MOVE OFTEN</text><text x="65" y="139" font-size="53" font-weight="700">Keep lifting. Build your aerobic base.</text><text x="65" y="181" font-size="22">Brisk walking, cycling or an elliptical. No running requirement.</text>
<rect x="65" y="225" width="1070" height="220" rx="25" fill="#173f35"/><g fill="#fffef9"><text x="95" y="267" font-size="15" letter-spacing="2">WEEKS 1–2</text><text x="450" y="267" font-size="15" letter-spacing="2">WEEKS 3–4</text><text x="805" y="267" font-size="15" letter-spacing="2">WEEKS 5–12</text><text x="95" y="326" font-size="46" font-weight="700">60 min</text><text x="450" y="326" font-size="46" font-weight="700">100 min</text><text x="805" y="326" font-size="46" font-weight="700">150 min</text><text x="95" y="365" font-size="19">20 min × 3 days</text><text x="450" y="365" font-size="19">25 min × 4 days</text><text x="805" y="365" font-size="19">20 / 30 min across 6 days</text><text x="95" y="412" font-size="17">6,000–6,500 steps/day</text><text x="450" y="412" font-size="17">Around 7,000 steps/day</text><text x="805" y="412" font-size="17">7,000–8,000 steps/day</text></g>
<text x="65" y="500" font-size="25" font-weight="700">A steady-state week · from week 5</text>
<g font-size="18"><rect x="65" y="525" width="1070" height="128" rx="18" fill="#e2edda"/><text x="90" y="562" font-weight="700">MON</text><text x="240" y="562" font-weight="700">TUE</text><text x="390" y="562" font-weight="700">WED</text><text x="540" y="562" font-weight="700">THU</text><text x="690" y="562" font-weight="700">FRI</text><text x="840" y="562" font-weight="700">SAT</text><text x="990" y="562" font-weight="700">SUN</text><text x="90" y="598">Strength A</text><text x="240" y="598">Cardio</text><text x="390" y="598">Strength B</text><text x="540" y="598">Cardio</text><text x="690" y="598">Strength A*</text><text x="840" y="598">Cardio</text><text x="990" y="598">Recovery</text><text x="90" y="628">+ 20 min</text><text x="240" y="628">30 min</text><text x="390" y="628">+ 20 min</text><text x="540" y="628">30 min</text><text x="690" y="628">+ 20 min</text><text x="840" y="628">30 min</text><text x="990" y="628">Easy walk</text></g>
<text x="65" y="696" font-size="18">*Next week B / A / B. Include lower body. Strength sessions: usually 45–60 minutes.</text><text x="65" y="736" font-size="18">Talk test: sentences are possible, singing is difficult. Warm up and cool down separately.</text><text x="65" y="771" font-size="18">Steps include cardio walks. Progress gradually; step counts are practical goals, not thresholds.</text><text x="65" y="813" font-size="15" fill="#596d64">Adapt to recovery and medical advice. Stop for chest discomfort, fainting or unusual breathlessness.</text></g></svg>
